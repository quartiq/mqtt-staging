[package]
name = "ota-mqtt"
version = "0.1.0"
authors = ["Robert Jördens <rj@quartiq.de>"]
edition = "2024"
description = "MQTT firmware update service for embedded devices"
repository = "https://github.com/quartiq/ota-mqtt"
readme = "README.md"
categories = ["embedded", "no-std", "network-programming"]
keywords = ["mqtt", "ota", "embedded", "firmware"]
license = "MIT OR Apache-2.0"
rust-version = "1.93"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[dependencies]
defmt = "1.0.1"
heapless = { version = "0.9.1", features = ["serde"] }
itoa = "1"
minimq = "0.13"
serde = { version = "1.0", features = ["derive"], default-features = false }
serde-json-core = "0.6.0"

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }
defmt2log = "0.2.0"
embassy-futures = { version = "0.1.2", default-features = false }
embassy-time = { version = "0.5.1", default-features = false, features = ["std", "generic-queue-8"] }
embedded-io-async = { version = "0.7", features = ["std"] }
env_logger = "0.11"
