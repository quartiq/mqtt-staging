name: Continuous Integration

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROKER: 127.0.0.1:1883
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[dev]'
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
      - run: cargo package
      - run: python -m compileall -q mqtt_staging.py tests
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: ruff format --check mqtt_staging.py tests/test_host.py
      - run: ruff check mqtt_staging.py tests/test_host.py
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Start MQTT broker
        run: |
          docker run --detach --rm --network host --name mqtt-staging-broker eclipse-mosquitto:2 mosquitto -p 1883
          timeout 5 bash -c 'until </dev/tcp/127.0.0.1/1883 2>/dev/null; do sleep 0.1; done'
      - run: cargo test --test end_to_end -- --ignored
      - name: Stop MQTT broker
        if: always()
        run: docker stop mqtt-staging-broker >/dev/null 2>&1 || true

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo check --lib --target thumbv7em-none-eabihf
