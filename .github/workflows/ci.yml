name: Continuous Integration

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BROKER: 127.0.0.1:1883
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
      - run: cargo package
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: ruff format --check ota_mqtt.py tests/test_host.py
      - run: ruff check ota_mqtt.py tests/test_host.py
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Start MQTT broker
        run: docker run --detach --rm --network host --name ota-mqtt-broker eclipse-mosquitto:2 mosquitto -p 1883
      - run: cargo test --test end_to_end -- --ignored
      - name: Stop MQTT broker
        if: always()
        run: docker stop ota-mqtt-broker

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
